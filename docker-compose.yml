services:
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}
      POSTGRES_DB: litellm
    volumes:
      - litellm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "true"
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      CODEX_CLIENT_VERSION: "0.166.0"
    entrypoint: ["python", "/app/start_litellm.py"]
    command: ["--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/litellm-config.yaml
      - ./start_litellm.py:/app/start_litellm.py:ro
      - ./litellm-auth:/root/.config/litellm/chatgpt

volumes:
  litellm_db:
