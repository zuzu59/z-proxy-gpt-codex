services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-codex-test
    restart: unless-stopped
    environment:
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "true"
    command: ["--config", "/app/litellm-config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/litellm-config.yaml:ro
      - ./litellm-auth:/root/.config/litellm/chatgpt
